# TODO: configure secrets before enabling this workflow
# Required GitHub secrets:
#   DEPLOY_SSH_KEY  - Private SSH key for the production server
#   DEPLOY_HOST     - Remote host (e.g. your-gcp-instance.example.com)
#   DEPLOY_USER     - SSH user on the remote host (e.g. deploy)
#   DEPLOY_PATH     - Absolute path on the remote host (e.g. /opt/finascope)

name: CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest

    steps:
      # TODO: no additional secrets needed for checkout, but ensure the repo is accessible
      - name: Checkout
        uses: actions/checkout@v4

      # TODO: set DEPLOY_SSH_KEY secret before enabling
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      # TODO: set DEPLOY_HOST, DEPLOY_USER, DEPLOY_PATH secrets before enabling
      - name: SSH deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ~/.ssh/deploy_key
        run: bash scripts/deploy/deploy.sh
