AllCops:
  TargetRubyVersion: 3.4
  DisabledByDefault: true
  Exclude:
    - "gems/**/*"
  NewCops: enable
  SuggestExtensions: false

plugins:
  - rubocop-rspec

Bundler:
  Enabled: true

Gemspec:
  Enabled: true

Layout:
  Enabled: true

Lint:
  Enabled: true
Lint/UnusedMethodArgument:
  AllowUnusedKeywordArguments: true

Metrics:
  Enabled: false

Migration:
  Enabled: false

Naming:
  Enabled: true

Security:
  Enabled: true

Style:
  Enabled: true
Style/FrozenStringLiteralComment:
  Enabled: false
Style/Documentation:
  Enabled: false
Style/StringLiterals:
  EnforcedStyle: double_quotes
Style/TrailingCommaInArguments:
  Enabled: false
Style/SymbolArray:
  EnforcedStyle: brackets
Style/NumericLiterals:
  Enabled: false
Style/WordArray:
  Enabled: false
Style/RescueModifier:
  Enabled: false
Style/BarePercentLiterals:
  Enabled: false
