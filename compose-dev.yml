services:
  nginx:
    container_name: nginx
    build:
      context: ./nginx
      dockerfile: Dockerfile
    volumes:
      - ./nginx/files/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/files/conf.d:/etc/nginx/conf.d/:ro
      # - ./front/static:/usr/share/finascope:ro
    ports:
      - "8080:80"
    depends_on:
      - api
      - front-dev
    networks:
      - finascope-net
  api:
    container_name: api
    build:
      context: ./api
      dockerfile: Dockerfile
    command:
      [
        "sh",
        "-c",
        "bundle config set frozen true && bundle install && bundle exec rerun --background --force-polling -- rackup -o 0.0.0.0 -p 9292",
      ]
    volumes:
      - ./api:/app
      - bundle_cache:/var/bundle_cache
    environment:
      - BUNDLE_PATH=/var/bundle_cache
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=finascope_app
      - DB_PASSWORD=finascope_app_password
      - DB_NAME=finascope
  front-dev:
    container_name: front
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS=front
    build:
      context: ./front
      dockerfile: Dockerfile
      # NOTE: pnpm install is require stdin because using sh -c
    command:
      [
        "sh",
        "-c",
        "yes | pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0 --debug",
      ]
    volumes:
      - ./front:/app
      - /app/node_modules
  mysql:
    container_name: mysql
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: example
    user: 1000:1000
    volumes:
      - ./db/mysql:/var/lib/mysql
      - ./mysql/init.d:/docker-entrypoint-initdb.d

volumes:
  bundle_cache:
