services:
  nginx:
    container_name: nginx
    build:
      context: ./nginx
      dockerfile: Dockerfile
    volumes:
      - ./nginx/files/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/files/conf.d:/etc/nginx/conf.d/:ro
      # - ./front/static:/usr/share/finascope:ro
    ports:
      - "8080:80"
    depends_on:
      - api
      - front-dev
  api:
    container_name: api
    build:
      context: ./api
      dockerfile: Dockerfile
    command:
      [
        "sh",
        "-c",
        "bundle config set frozen true && bundle install && bundle exec rerun --background --force-polling -- rackup -o 0.0.0.0 -p 9292",
      ]
    volumes:
      - ./api:/app
      # - ./db:/var/finascope/db # Removed for MySQL
      - bundle_cache:/var/bundle_cache
    environment:
      # - FS_SQLITE_FILE=/var/finascope/db/finascope.sqlite3 # Removed for MySQL
      - BUNDLE_PATH=/var/bundle_cache
      - MYSQL_HOST: db
      - MYSQL_PORT: 3306
      - MYSQL_USER: finascope_user
      - MYSQL_PASSWORD: finascope_password
      - MYSQL_DATABASE: finascope_db
    depends_on: # Added for clarity, db service is in compose.yml
      - db
  front-dev:
    container_name: front
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS=front
    build:
      context: ./front
      dockerfile: Dockerfile
      # NOTE: pnpm install is require stdin because using sh -c
    command:
      [
        "sh",
        "-c",
        "yes | pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0 --debug",
      ]
    volumes:
      - ./front:/app
      - /app/node_modules
volumes:
  bundle_cache:
